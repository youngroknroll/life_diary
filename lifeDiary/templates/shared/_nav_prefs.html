{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
{% get_available_languages as LANGUAGES %}
{% get_language_info_list for LANGUAGES as language_options %}
<div class="app-nav__prefs">
    <div class="dropdown" id="themeMenu">
        <button class="app-nav__pref" type="button" data-bs-toggle="dropdown" aria-expanded="false"
                aria-label="{% trans '테마 선택' %}" title="{% trans '테마 선택' %}">
            <i class="fas fa-sun" data-theme-icon aria-hidden="true"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end app-nav__pref-menu" role="menu">
            <li>
                <button type="button" class="dropdown-item app-nav__pref-item" data-theme-choice="light"
                        role="menuitemradio" aria-checked="false">
                    <i class="fas fa-sun app-nav__pref-icon" aria-hidden="true"></i>{% trans "라이트" %}
                </button>
            </li>
            <li>
                <button type="button" class="dropdown-item app-nav__pref-item" data-theme-choice="dark"
                        role="menuitemradio" aria-checked="false">
                    <i class="fas fa-moon app-nav__pref-icon" aria-hidden="true"></i>{% trans "다크" %}
                </button>
            </li>
            <li>
                <button type="button" class="dropdown-item app-nav__pref-item" data-theme-choice="system"
                        role="menuitemradio" aria-checked="false">
                    <i class="fas fa-circle-half-stroke app-nav__pref-icon" aria-hidden="true"></i>{% trans "시스템" %}
                </button>
            </li>
        </ul>
    </div>

    <div class="dropdown">
        <button class="app-nav__pref" type="button" data-bs-toggle="dropdown" aria-expanded="false"
                aria-label="{% trans '언어 선택' %}" title="{% trans '언어 선택' %}">
            <span class="app-nav__pref-code">{{ LANGUAGE_CODE|slice:":2"|upper }}</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end app-nav__pref-menu" role="menu">
            {% for language in language_options %}
            <li>
                <form action="{% url 'set_language' %}" method="post" data-no-loading>
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ request.get_full_path }}">
                    <input type="hidden" name="language" value="{{ language.code }}">
                    <button type="submit" role="menuitemradio"
                            class="dropdown-item app-nav__pref-item{% if language.code == LANGUAGE_CODE %} is-active{% endif %}"
                            aria-checked="{% if language.code == LANGUAGE_CODE %}true{% else %}false{% endif %}">
                        <span class="app-nav__pref-icon">{{ language.code|upper }}</span>{{ language.name_local }}
                    </button>
                </form>
            </li>
            {% endfor %}
        </ul>
    </div>
</div>
