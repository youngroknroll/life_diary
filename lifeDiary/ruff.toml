line-length = 100
target-version = "py313"
extend-exclude = ["migrations", "staticfiles", ".worktrees"]

[lint]
select = ["E4", "E501", "E7", "E9", "F", "W", "I", "N", "UP", "B", "SIM", "D"]

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"lifeDiary/settings/*.py" = ["F403", "F405"]
"lifeDiary/__init__.py" = ["N999"]
".claude/hooks/*.py" = ["E401", "E741", "E501", "I", "UP", "D"]
"**/__init__.py" = ["D1"]
"**/apps.py" = ["D1"]
"**/urls.py" = ["D1"]
"**/models.py" = ["D1"]
"**/admin.py" = ["D1"]
"**/forms.py" = ["D1"]
"**/signals.py" = ["D1"]
"**/schemas.py" = ["D1"]
"**/ports.py" = ["D1"]
"**/repositories.py" = ["D1"]
"**/receivers.py" = ["D1"]
"**/management/**" = ["D1"]
"**/templatetags/**" = ["D1"]
"**/aggregation/**" = ["D1"]
"**/tests.py" = ["D1"]
"**/test_*.py" = ["D1"]
"**/conftest.py" = ["D1"]
"conftest.py" = ["D1"]
"scripts/**" = ["D1"]
"desktop/**" = ["D1"]
"lifeDiary/settings/**" = ["D1"]
"**/email_verification.py" = ["D1"]
"**/login_protection.py" = ["D1"]
"**/verification_policy.py" = ["D1"]
"**/account_deletion.py" = ["D1"]
"**/social_forms.py" = ["D1"]
"**/goal_deadline.py" = ["D1"]
"**/adapters.py" = ["D1"]
"**/middleware.py" = ["D1"]
"**/commands.py" = ["D1"]
"**/undo.py" = ["D1"]
"**/logic.py" = ["D1"]
"**/export.py" = ["D1"]
