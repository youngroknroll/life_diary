{% load i18n %}
<!--
    태그 생성 및 수정을 위한 공통 모달
    - ID: tagFormModal
    - 이 템플릿을 include하는 곳에서는 tag_form_js.html도 함께 include 해야 합니다.
-->
<div class="modal fade" id="tagFormModal" tabindex="-1" style="z-index: 1060;">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="tagFormModalTitle">{% trans "새 태그 생성" %}</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="tagForm">
                    <input type="hidden" id="tagFormTagId">
                    <div class="mb-3">
                        <label for="tagFormCategory" class="form-label">{% trans "카테고리" %}</label>
                        <select class="form-select tag-category-select" id="tagFormCategory" required>
                            <option value="">{% trans "카테고리를 선택하세요" %}</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="tagFormName" class="form-label">{% trans "태그명" %}</label>
                        <input type="text" class="form-control" id="tagFormName" maxlength="50" required>
                    </div>
                    <div class="mb-3">
                        <label for="tagFormColor" class="form-label">{% trans "색상" %}</label>
                        <div class="d-flex align-items-center gap-2">
                            <input type="color" class="form-control form-control-color" id="tagFormColor" value="#2f7d4f">
                            <input type="text" class="form-control" id="tagFormColorText" placeholder="#2f7d4f" maxlength="7">
                        </div>
                        <div class="tag-color-recommendations mt-2" aria-label="{% trans '추천색상' %}">
                            <span class="tag-color-recommendations__label">{% trans "추천색상:" %}</span>
                            <button type="button" class="tag-color-swatch" data-tag-color-swatch data-color="#e85d5d" style="background-color: #e85d5d;" aria-label="{% trans '추천색상' %} #e85d5d"></button>
                            <button type="button" class="tag-color-swatch" data-tag-color-swatch data-color="#c94a4a" style="background-color: #c94a4a;" aria-label="{% trans '추천색상' %} #c94a4a"></button>
                            <button type="button" class="tag-color-swatch" data-tag-color-swatch data-color="#e48f4f" style="background-color: #e48f4f;" aria-label="{% trans '추천색상' %} #e48f4f"></button>
                            <button type="button" class="tag-color-swatch" data-tag-color-swatch data-color="#c9783f" style="background-color: #c9783f;" aria-label="{% trans '추천색상' %} #c9783f"></button>
                            <button type="button" class="tag-color-swatch" data-tag-color-swatch data-color="#f0c24b" style="background-color: #f0c24b;" aria-label="{% trans '추천색상' %} #f0c24b"></button>
                            <button type="button" class="tag-color-swatch" data-tag-color-swatch data-color="#d4a93a" style="background-color: #d4a93a;" aria-label="{% trans '추천색상' %} #d4a93a"></button>
                            <button type="button" class="tag-color-swatch" data-tag-color-swatch data-color="#4f9f68" style="background-color: #4f9f68;" aria-label="{% trans '추천색상' %} #4f9f68"></button>
                            <button type="button" class="tag-color-swatch" data-tag-color-swatch data-color="#3f8757" style="background-color: #3f8757;" aria-label="{% trans '추천색상' %} #3f8757"></button>
                            <button type="button" class="tag-color-swatch" data-tag-color-swatch data-color="#5a9fd6" style="background-color: #5a9fd6;" aria-label="{% trans '추천색상' %} #5a9fd6"></button>
                            <button type="button" class="tag-color-swatch" data-tag-color-swatch data-color="#477fb3" style="background-color: #477fb3;" aria-label="{% trans '추천색상' %} #477fb3"></button>
                            <button type="button" class="tag-color-swatch" data-tag-color-swatch data-color="#5d6fc2" style="background-color: #5d6fc2;" aria-label="{% trans '추천색상' %} #5d6fc2"></button>
                            <button type="button" class="tag-color-swatch" data-tag-color-swatch data-color="#4858a3" style="background-color: #4858a3;" aria-label="{% trans '추천색상' %} #4858a3"></button>
                            <button type="button" class="tag-color-swatch" data-tag-color-swatch data-color="#9b6ccf" style="background-color: #9b6ccf;" aria-label="{% trans '추천색상' %} #9b6ccf"></button>
                            <button type="button" class="tag-color-swatch" data-tag-color-swatch data-color="#7d55ad" style="background-color: #7d55ad;" aria-label="{% trans '추천색상' %} #7d55ad"></button>
                        </div>
                    </div>
                    {% if user.is_superuser %}
                    <div class="mb-3" id="tagFormDefaultOption">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="tagFormIsDefault">
                            <label class="form-check-label" for="tagFormIsDefault">
                                <i class="fas fa-star text-warning me-1"></i>
                                {% trans "기본 태그로 설정 (모든 사용자가 사용 가능)" %}
                            </label>
                        </div>
                        <small class="text-muted">{% trans "기본 태그는 관리자가 아니면 수정/삭제할 수 없습니다." %}</small>
                    </div>
                    {% endif %}
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">{% trans "취소" %}</button>
                <button type="button" class="btn btn-primary" id="saveTagFormBtn">{% trans "저장" %}</button>
            </div>
        </div>
    </div>
</div>
