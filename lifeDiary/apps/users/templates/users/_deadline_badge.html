{% load i18n %}{% if deadline.state == "overdue" %}<span class="deadline-badge is-overdue">{% trans "기한 지남" %}</span>{% elif deadline.state == "due_today" %}<span class="deadline-badge is-soon num">{% trans "D-day" %}</span>{% elif deadline.state == "upcoming" %}<span class="deadline-badge num{% if deadline.days <= 3 %} is-soon{% endif %}">{% blocktrans with n=deadline.days %}D-{{ n }}{% endblocktrans %}</span>{% endif %}
