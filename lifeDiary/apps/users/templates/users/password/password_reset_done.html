{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "비밀번호 재설정 메일 발송" %} | {% trans "라이프 다이어리" %}{% endblock %}

{% block content %}
<div class="auth-panel">
    <div class="card auth-card">
        <div class="card-body">
            <h1 class="auth-panel__title">{% trans "메일을 확인해주세요" %}</h1>
            <p class="auth-panel__lead">
                {% trans "입력하신 이메일이 등록되어 있다면, 비밀번호 재설정 링크가 발송되었습니다. 메일이 보이지 않으면 스팸함을 확인해주세요." %}
            </p>

            <div class="d-grid gap-2">
                <a href="{% url 'users:login' %}" class="btn-sian">{% trans "로그인으로 돌아가기" %}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
