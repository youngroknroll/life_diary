{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "비밀번호 변경 완료" %} | {% trans "라이프 다이어리" %}{% endblock %}

{% block content %}
<div class="auth-panel">
    <div class="card auth-card">
        <div class="card-body">
            <h1 class="auth-panel__title">{% trans "비밀번호가 변경되었습니다" %}</h1>
            <p class="auth-panel__lead">{% trans "새 비밀번호로 로그인하실 수 있습니다." %}</p>

            <div class="d-grid gap-2">
                <a href="{% url 'users:login' %}" class="btn-sian btn-sian--primary">{% trans "로그인" %}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
