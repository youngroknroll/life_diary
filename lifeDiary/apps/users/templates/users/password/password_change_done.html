{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "비밀번호 변경 완료" %} | {% trans "라이프 다이어리" %}{% endblock %}

{% block content %}
<div class="auth-panel">
    <div class="card auth-card">
        <div class="card-body">
            <h1 class="auth-panel__title">{% trans "비밀번호를 바꿨습니다" %}</h1>
            <p class="auth-panel__lead">{% trans "다음 로그인부터 새 비밀번호를 쓰세요. 지금 세션은 그대로 유지됩니다." %}</p>

            <div class="d-grid gap-2">
                <a href="{% url 'users:mypage' %}" class="btn-sian btn-sian--primary">{% trans "설정으로 돌아가기" %}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
