name: Update deploy PR

on:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  update-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install LifeDiary dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r lifeDiary/requirements.txt

      - name: Verify LifeDiary deploy readiness
        working-directory: lifeDiary
        env:
          DJANGO_SECRET_KEY: test-ci-secret-value-for-deploy-readiness-checks-only-1234567890
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_HOST: localhost
          DB_PORT: '6543'
          RESEND_API_KEY: re_test_dummy
          DEFAULT_FROM_EMAIL: LifeDiary <noreply@example.com>
        run: |
          python -m pytest lifeDiary/test_prod_settings.py apps/core/test_email_backends.py --tb=short
          python manage.py check --settings=lifeDiary.settings.prod --deploy --fail-level ERROR

      - name: Create or update deploy PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          retry() {
            local attempt
            for attempt in 1 2 3; do
              if "$@"; then
                return 0
              fi

              if [ "${attempt}" -lt 3 ]; then
                echo "Attempt ${attempt} failed. Retrying in 5 seconds..."
                sleep 5
              fi
            done

            echo "Command failed after 3 attempts: $*"
            return 1
          }

          git fetch origin production

          DIFF_COUNT=$(git rev-list --count origin/production..origin/main)
          if [ "$DIFF_COUNT" -eq 0 ]; then
            echo "production already up to date. No PR needed."
            exit 0
          fi

          # production 에만 있는 내용을 찾는다.
          #
          # 커밋 수로는 알 수 없다. 배포가 merge commit 이면 production 에
          # 그 커밋이 남고, squash 면 배포 내용 전체가 남는다. 둘 다 "직접
          # 수정"과 구별이 안 된다. 그래서 파일 내용(blob)으로 본다 — main
          # 이력 어디에도 없는 blob 이 있으면 그건 production 에서 직접 만든
          # 것이다. www.lifediary.kr 누락이 이 경우였다.
          git rev-list --objects origin/main | awk '{print $1}' | sort -u > /tmp/main_objects
          ORPHANS=$(git ls-tree -r origin/production \
            | awk '{print $3"\t"$4}' \
            | while IFS=$'\t' read -r blob path; do
                grep -qx "$blob" /tmp/main_objects || echo "- \`${path}\`"
              done)

          # 두 브랜치가 마지막으로 같았던 지점. 배포를 merge commit 으로
          # 병합하면 이 지점이 이번 main 끝으로 옮겨간다. squash 로 병합하면
          # 옮겨가지 않아 다음 배포에서 같은 커밋을 다시 싣게 된다.
          MERGE_BASE=$(git merge-base origin/main origin/production)
          MERGE_BASE_LINE=$(git log -1 --date=short --pretty='%h %ad %s' "$MERGE_BASE")
          PROD_AHEAD=$(git rev-list --count "${MERGE_BASE}..origin/production")

          WARNINGS=""
          if [ -n "${ORPHANS}" ]; then
            echo "::warning::production 에만 있는 파일이 있습니다. main 으로 되돌려 넣지 않으면 이번 배포에서 사라집니다."
            WARNINGS=$(printf '### ⚠️ production 에만 있는 내용\n\n아래 파일은 main 이력 어디에도 없습니다. production 에 직접 커밋된 것으로 보입니다.\n**이대로 병합하면 이 변경이 사라집니다.** main 에 먼저 반영하세요.\n\n%s\n' "${ORPHANS}")
          fi

          EXISTING=$(retry gh pr list --base production --head main --state open --json number --jq '.[0].number // empty')

          COMMITS=$(git log -50 origin/production..origin/main --pretty=format:'- %s (%h)')

          BODY=$(cat <<EOF
          ## Deploy candidate

          **${DIFF_COUNT} commits** ready to deploy from \`main\` to \`production\`.

          Merge this PR to deploy to Render.

          ${WARNINGS}

          ### 계보

          - 두 브랜치가 마지막으로 같았던 지점: \`${MERGE_BASE_LINE}\`
          - 그 뒤 production 이 쌓은 커밋: ${PROD_AHEAD}개

          \`Create a merge commit\` 으로 병합하면 이 지점이 이번 main 끝으로 옮겨갑니다.
          병합 뒤 이 PR 의 커밋 수는 **0 으로 떨어져야** 정상입니다. 다음 배포에서
          숫자가 누적돼 있으면 squash 로 병합된 것입니다.

          ### Commits

          ${COMMITS}

          ---
          Auto-generated by \`.github/workflows/deploy-pr.yml\`. Updates on every push to main.
          EOF
          )

          TITLE="Deploy: main -> production (${DIFF_COUNT} commits)"

          if [ -z "${EXISTING}" ]; then
            retry gh pr create \
              --base production \
              --head main \
              --title "${TITLE}" \
              --body "${BODY}"
            echo "Created new deploy PR."
          else
            retry gh pr edit "${EXISTING}" \
              --title "${TITLE}" \
              --body "${BODY}"
            echo "Updated existing deploy PR #${EXISTING}."
          fi
